<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <title>Insert row in a table - w3resource</title>
    <!-- Liên kết tới file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/cau30.css">
</head>

<body>

    <h2>Thêm hàng vào Bảng (Insert Row)</h2>

    <!-- Bảng theo mã nguồn đề bài -->
    <table id="sampleTable" border="1">
        <tr>
            <td>Row1 cell1</td>
            <td>Row1 cell2</td>
        </tr>
        <tr>
            <td>Row2 cell1</td>
            <td>Row2 cell2</td>
        </tr>
    </table><br>

    <!-- Nút bấm kích hoạt hàm insert_Row() -->
    <input type="button" onclick="insert_Row()" value="Insert row">

    <!-- Liên kết tới file JavaScript trong thư mục Scripts -->
    <script src="Scripts/cau30.js"></script>
</body>

</html>
