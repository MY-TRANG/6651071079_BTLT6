<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <title>Return first and last name from a form</title>
    <!-- Liên kết tới file CSS -->
    <link rel="stylesheet" href="Styles/cau2.css">
</head>

<body>

    <h2>Lấy thông tin Họ và Tên bằng jQuery</h2>

    <!-- Form theo mã nguồn đề bài -->
    <form id="form1" onsubmit="getFormvalue(event)">
        First name: <input type="text" name="fname" value="David"><br>
        Last name: <input type="text" name="lname" value="Beckham"><br>
        <input type="submit" value="Submit">
    </form>

    <!-- Nhúng thư viện jQuery và file script -->
    <script src="Scripts/jquery-4.0.0.min.js"></script>
    <script src="Scripts/cau2.js"></script>
</body>

</html>
